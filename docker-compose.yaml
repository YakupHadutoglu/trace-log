version: '3.8'

services:
    #! =========================== DATABASES ===========================
    postgres:
        image: postgres:13
        container_name: postgres_trace_log_db
        restart: always
        environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=123postgres123
            - POSTGRES_DB=trace-log
        ports:
            - "5432:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data

    mongo:
        image: mongo:7
        container_name: mongo_trace_log_db
        restart: always
        ports:
            - "27017:27017"
        volumes:
            - mongo_data:/data/db

    redis:
        image: redis:7
        container_name: redis_trace_log_db
        restart: always
        ports:
            - "6379:6379"
        command: ["redis-server" , "--appendonly" , "yes"]
        volumes:
            - redis_data:/data
    #! =========================== BACKEND ===========================
    backend:
        build:
            context: ./backend
            dockerfile: Dockerfile
        container_name: tracelog_backend
        restart: always
        ports:
            - "3001:3001"
        env_file:
            - ./backend/.env
        depends_on:
            - postgres
            - mongo
            - redis
        volumes:
            - ./backend:/app
            - /app/node_modules

    #! =========================== FRONTEND ===========================
    frontend:
        build:
            context: ./frontend/tracelog-frontend
            dockerfile: Dockerfile
        container_name: tracelog-frontend
        restart: always
        ports:
            - "3000:3000"
        env_file:
            - ./frontend/tracelog-frontend/.env.local
        depends_on:
            - backend
        volumes:
            - ./frontend/tracelog-frontend:/app
            - /app/node_modules

volumes:
    postgres_data:
    mongo_data:
    redis_data:
